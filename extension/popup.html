<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>WordBridge</title><link rel="stylesheet" href="styles.css"></head>
<body class="popup">
  <h2>🌐 WordBridge</h2>
  <label for="language">Translate into</label>
  <select id="language">
    <option value="hindi">Hindi - हिन्दी</option>
    <option value="marathi">Marathi - मराठी</option>
    <option value="kannada">Kannada - ಕನ್ನಡ</option>
    <option value="gujarati">Gujarati - ગુજરાતી</option>
    <option value="punjabi">Punjabi - ਪੰਜਾਬੀ</option>
  </select>
  <button id="saveLanguage">Save language</button>
  <p id="status" role="status"></p>
  <hr>
  <p class="hint">Double-click a word on a webpage to translate it.</p>
  <script src="popup.js"></script>
</body></html>
