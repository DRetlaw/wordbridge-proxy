<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>WordBridge Settings</title><link rel="stylesheet" href="styles.css"></head>
<body class="options"><div class="settings-card">
  <h1>🌐 WordBridge</h1>
  <p>Choose your preferred translation language.</p>
  <label for="language">Preferred language</label>
  <select id="language">
    <option value="hindi">Hindi - हिन्दी</option>
    <option value="marathi">Marathi - मराठी</option>
    <option value="kannada">Kannada - ಕನ್ನಡ</option>
    <option value="gujarati">Gujarati - ગુજરાતી</option>
    <option value="punjabi">Punjabi - ਪੰਜਾਬੀ</option>
  </select>
  <p class="hint">The OpenRouter key is held by the Cloudflare backend. It is not entered or stored in this extension.</p>
  <button id="save">Save Settings</button><p id="status" role="status"></p>
</div><script src="options.js"></script></body></html>
